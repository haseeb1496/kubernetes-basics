apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dummysites.example.com
spec:
  group: example.com
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                website_url:
                  type: string
                  format: uri
                  description: "The URL of the website to create a copy of"
              required:
                - website_url
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Processing", "Ready", "Failed"]
                  description: "Current phase of the DummySite"
                message:
                  type: string
                  description: "Human readable message about the current status"
                lastUpdated:
                  type: string
                  format: date-time
                  description: "Last time the status was updated"
                url:
                  type: string
                  format: uri
                  description: "The URL where the copied site can be accessed"
  scope: Namespaced
  names:
    plural: dummysites
    singular: dummysite
    kind: DummySite
    shortNames:
      - ds

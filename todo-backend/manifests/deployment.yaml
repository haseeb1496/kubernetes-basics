apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-deployment
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
    spec:
      containers:
        - name: todo-backend-container
          image: todo-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-project-configmap
                  key: TODO_BACKEND_SERVICE_PORT
            - name: TODO_MAX_LENGTH
              valueFrom:
                configMapKeyRef:
                  name: todo-project-configmap
                  key: TODO_MAX_LENGTH

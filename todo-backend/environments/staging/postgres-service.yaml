apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: todo-staging
  labels:
    app: postgres
    environment: staging
    managed-by: argocd
    gitops: enabled
spec:
  selector:
    app: postgres
    environment: staging
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP
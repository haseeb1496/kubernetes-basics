apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backup-pvc
  namespace: todo-production
  labels:
    app: postgres
    component: backup
    environment: production
    managed-by: argocd
    gitops: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: todo-production
  labels:
    app: postgres
    environment: production
    managed-by: argocd
    gitops: enabled
spec:
  selector:
    app: postgres
    environment: production
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
  type: ClusterIP

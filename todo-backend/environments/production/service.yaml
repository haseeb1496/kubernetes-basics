apiVersion: v1
kind: Service
metadata:
  name: todo-backend-svc
  namespace: todo-production
  labels:
    app: todo-backend
    environment: production
    managed-by: argocd
    gitops: enabled
spec:
  selector:
    app: todo-backend
    environment: production
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

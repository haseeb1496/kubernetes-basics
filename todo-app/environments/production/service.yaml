apiVersion: v1
kind: Service
metadata:
  name: todo-app-svc
  namespace: todo-production
  labels:
    app: todo-app
    environment: production
    managed-by: argocd
    gitops: enabled
spec:
  selector:
    app: todo-app
    environment: production
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

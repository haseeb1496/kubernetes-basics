apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-project-configmap
  namespace: todo-production
  labels:
    app: todo-app
    environment: production
    managed-by: argocd
    gitops: enabled
data:
  TODO_BACKEND_HOST: "todo-backend-svc.todo-production.svc.cluster.local"
  TODO_BACKEND_PORT: "3000"
  TODO_BACKEND_URL: "http://todo-backend-svc.todo-production.svc.cluster.local:3000"
  TODO_MAX_LENGTH: "140"
  TODO_APP_PORT: "8080"
  TODO_BACKEND_SERVICE_PORT: "3000"
  ENVIRONMENT: "production"
  GITOPS_MANAGED: "true"
  BROADCAST_MODE: "external-service"
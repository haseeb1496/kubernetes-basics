apiVersion: batch/v1
kind: CronJob
metadata:
  name: wikipedia-todo-cronjob
  namespace: todo-staging
  labels:
    app: todo-app
    component: cronjob
    environment: staging
    managed-by: argocd
    gitops: enabled
spec:
  schedule: "0 12 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: todo-app
            component: cronjob-pod
            environment: staging
        spec:
          containers:
          - name: wikipedia-todo
            image: todo-app:latest
            imagePullPolicy: IfNotPresent
            command: ["npm", "run", "cronjob"]
            env:
            - name: TODO_BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-project-configmap
                  key: TODO_BACKEND_URL
            - name: ENVIRONMENT
              value: "staging"
            - name: BROADCAST_MODE
              value: "log-only"
          restartPolicy: OnFailure